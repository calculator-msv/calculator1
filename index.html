<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід та Реєстрація у систему ТЕМ</title>
    <style>
        body { font-family: sans-serif; background: #1b3022; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; box-sizing: border-box; }
        .card { background: rgba(0,0,0,0.7); padding: 30px; border-radius: 10px; width: 340px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 15px; color: #2ecc71; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 15px; border-bottom: 1px solid #444; }
        .tab-btn { background: none; border: none; color: #aaa; padding: 10px; cursor: pointer; font-size: 15px; width: 50%; font-weight: bold; }
        .tab-btn.active { color: #2ecc71; border-bottom: 2px solid #2ecc71; }
        .form-group { display: none; }
        .form-group.active { display: block; }
        input { width: 100%; padding: 12px; margin: 6px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
        button.action-btn { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 16px; }
        button.action-btn:hover { background: #219150; }
        .guest-btn { background: #2980b9; margin-top: 10px; width: 100%; padding: 12px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .guest-btn:hover { background: #1f6694; }
    </style>

    <!-- 1. Бібліотека Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Конфігурація -->
    <script src="supabase-config.js"></script>
</head>
<body>

<div class="card">
    <h2 id="form-title">Система ТЕМ</h2>
    
    <!-- Перемикач Вхід / Реєстрація -->
    <div class="tabs">
        <button type="button" class="tab-btn active" onclick="switchTab('login')">ВХІД</button>
        <button type="button" class="tab-btn" onclick="switchTab('register')">РЕЄСТРАЦІЯ</button>
    </div>

    <!-- ФОРМА ВХОДУ -->
    <div id="login-form" class="form-group active">
        <input type="email" id="login-email" placeholder="Email (Електронна пошта)">
        <input type="password" id="login-password" placeholder="Пароль">
        <button class="action-btn" type="button" onclick="handleLogin()">УВІЙТИ</button>
    </div>

    <!-- ФОРМА РЕЄСТРАЦІЇ -->
    <div id="register-form" class="form-group">
        <input type="text" id="reg-fullname" placeholder="ПІБ або Підрозділ">
        <input type="email" id="reg-email" placeholder="Email (Електронна пошта)">
        <input type="password" id="reg-password" placeholder="Пароль (від 6 символів)">
        <button class="action-btn" type="button" onclick="handleRegister()">ЗАРЕЄСТРУВАТИСЯ</button>
    </div>

    <button type="button" onclick="loginAsGuest()" class="guest-btn">УВІЙТИ ЯК ГІСТЬ</button>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-group').forEach(form => form.classList.remove('active'));

        if (tab === 'login') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('login-form').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('register-form').classList.add('active');
        }
    }

    function getSupabaseClient() {
        if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient.auth) return window.supabaseClient;
        if (typeof window.supabase !== 'undefined' && window.supabase.auth) return window.supabase;
        if (typeof supabase !== 'undefined' && supabase.auth) return supabase;
        return null;
    }

    // ГОЛОВНИЙ ОБРОБНИК ВХОДУ
    async function handleLogin() {
        const client = getSupabaseClient();
        if (!client) {
            alert("Помилка: Файл supabase-config.js не підключено або в ньому помилка!");
            return;
        }

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value.trim();

        if (!email || !password) {
            alert("Введіть Email та Пароль!");
            return;
        }

        try {
            const { data, error } = await client.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert("Помилка входу: " + error.message);
                return;
            }

            const user = data.user;
            localStorage.setItem('currentUser', JSON.stringify({
                uid: user.id,
                email: user.email,
                username: user.user_metadata?.full_name || user.email.split('@')[0],
                role: 'user'
            }));

            alert("Успішний вхід!");
            window.location.href = 'home.html';
        } catch (err) {
            alert("Помилка при вході: " + err.message);
        }
    }

    // ГОЛОВНИЙ ОБРОБНИК РЕЄСТРАЦІЇ
    async function handleRegister() {
        const client = getSupabaseClient();
        if (!client) {
            alert("Помилка підключення до Supabase!");
            return;
        }

        const fullName = document.getElementById('reg-fullname').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value.trim();

        if (!fullName || !email || !password) {
            alert("Будь ласка, заповніть усі поля!");
            return;
        }

        if (password.length < 6) {
            alert("Пароль має містити щонайменше 6 символів!");
            return;
        }

        try {
            const { data, error } = await client.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { full_name: fullName }
                }
            });

            if (error) {
                alert("Помилка реєстрації: " + error.message);
                return;
            }

            if (data.user) {
                localStorage.setItem('currentUser', JSON.stringify({
                    uid: data.user.id,
                    username: fullName,
                    email: email,
                    role: 'user'
                }));

                alert("Акаунт успішно створено!");
                window.location.href = 'home.html';
            }
        } catch (err) {
            alert("Помилка реєстрації: " + err.message);
        }
    }

    async function loginAsGuest() {
        const client = getSupabaseClient();
        if (client) {
            try { await client.auth.signOut(); } catch (e) {}
        }
        localStorage.clear();
        localStorage.setItem('currentUser', JSON.stringify({ username: 'Гість', role: 'guest', uid: 'guest_local' }));
        window.location.href = 'home.html';
    }
</script>

</body>
</html>
